syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.comp713.grpc";
option java_outer_classname = "TaskEventsProto";

service TaskEventService {
    rpc RecordTaskStatusChange (TaskStatusChangeRequest)
        returns (TaskStatusChangeResponse);
}

message TaskStatusChangeRequest {
    int32 task_id = 1;
    string task_title = 2;
    string old_status = 3;
    string new_status = 4;
    int32 user_id = 5;
}

message TaskStatusChangeResponse {
    bool success = 1;
    string message = 2;
}